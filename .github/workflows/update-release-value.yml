# Resets the release value at the start of the week
#
# Triggered by
# Sunday 23:59
# Manual dispatch
#

on:
    schedule:
      - cron: "59 23 * * 0" # Sunday 23:59
    workflow_dispatch:
  
jobs:
  update:
    name: Update repo variable
    runs-on: ubuntu-latest
    steps:
      - name: Update repo variable
        run: |
          curl -L \
          -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.LONGBOI_BOT_KEY }}"\
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/BenWalker01/longboi-life/actions/variables/CURRENT_RELEASE_VALUE \
          -d '{"name":"BenWalker01","value":"test"}'
