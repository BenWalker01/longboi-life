# Builds and Uploads jar file as an Artifact
#
# Triggered by:
# PR to Main
# Manual Trigger
#

name: Build, upload, and Test

on:
  pull_request:
    branches: ['main']
    paths: ['game/**']
  workflow_dispatch:


jobs:
    build:
      runs-on: ubuntu-latest

      permissions:
        contents: read  

      steps:
        - uses: actions/checkout@v4

        - name: Setup JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
        
        - name: Build with Gradle
          run: |
            cd game
            chmod +x gradlew 
            ./gradlew clean build jacocoTestReport
        
        - name: Make jar executable
          run: chmod +x game/lwjgl3/build/libs/*.jar

          # https://stackoverflow.com/questions/68481561/github-actions-keep-artifacts-only-for-the-latest-build-on-each-branch
        - name: store artifact name
          id: artifact-name
          env:
            REF: ${{ github.ref }}
          run: echo "::set-output name=value::${REF////-}-build-artifact"

        - name: Filter and delete artifacts
          uses: actions/github-script@v4
          id: artifact
          with:
            script: |
              const { owner, repo } = context.issue

              const res = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
              })

              res.data.artifacts
                .filter(({ name }) => name === '${{ steps.artifact-name.outputs.value }}')
                .forEach(({ id }) => {
                  github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: id,
                  })
                })
            
        - name: Upload JaCoCo report 
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report-${{ github.head_ref || github.ref_name }}
            path: game/headless/build/reports/jacoco/test/html

        - name: Upload build as artifact
          uses: actions/upload-artifact@v4
          env:
            REF: ${{ github.ref }}
          with:
            include-hidden-files: true
            name: ${{ steps.artifact-name.outputs.value }}
            path: game/lwjgl3/build/libs

        
    

