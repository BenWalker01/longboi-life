# Builds and Uploads jar file as an Artifact
#
# Triggered by:
# PR to Main
# Manual Trigger
#

name: Build, upload, and Test

on:
  pull_request:
    branches: ['main']
    paths: ['game/**']
  workflow_dispatch:


jobs:
    build:
      runs-on: ubuntu-latest

      permissions:
        contents: read  

      steps:
        - uses: actions/checkout@v4

        - name: Setup JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
        
        - name: Build with Gradle
          run: |
            cd game
            chmod +x gradlew 
            ./gradlew clean build jacocoTestReport
        
        - name: Make jar executable
          run: chmod +x game/lwjgl3/build/libs/*.jar

        - name: Upload JaCoCo report 
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report-${{ github.event.pull_request.head.sha }}
            path: game/headless/build/reports/jacoco/test/html

        - name: Upload build as artifact
          uses: actions/upload-artifact@v4
          with:
            include-hidden-files: true
            name: build-artifact-${{ github.event.pull_request.head.sha }}
            path: game/lwjgl3/build/libs
    

